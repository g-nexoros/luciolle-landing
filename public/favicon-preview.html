<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: system-ui; background: #f0f0f0; padding: 40px; margin: 0; }
    .row { display: flex; gap: 40px; align-items: flex-start; flex-wrap: wrap; }
    .card { background: white; border-radius: 20px; padding: 32px; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,0.1); }
    .card h2 { margin: 16px 0 4px; font-size: 15px; color: #333; }
    .card p { margin: 0; font-size: 12px; color: #999; }
    .size-label { font-size: 11px; color: #bbb; margin-top: 8px; }
    .sizes { display: flex; gap: 16px; align-items: center; justify-content: center; margin-top: 12px; }
  </style>
</head>
<body>
  <h1 style="color:#333; margin-bottom:32px;">Aperçu icônes Luciolle</h1>
  <div class="row">

    <div class="card">
      <img src="/favicon-a.svg?v=2" width="256" height="256" style="display:block;">
      <h2>Version A</h2>
      <p>Fond bleu · Étoile 8 branches</p>
      <div class="sizes">
        <img src="/favicon-a.svg?v=2" width="64" height="64">
        <img src="/favicon-a.svg?v=2" width="32" height="32">
        <img src="/favicon-a.svg?v=2" width="16" height="16">
      </div>
      <p class="size-label">256px · 64px · 32px · 16px</p>
    </div>

    <div class="card">
      <img src="/favicon-b.svg?v=2" width="256" height="256" style="display:block;">
      <h2>Version B</h2>
      <p>Fond blanc · Luciole rayonnante</p>
      <div class="sizes">
        <img src="/favicon-b.svg?v=2" width="64" height="64">
        <img src="/favicon-b.svg?v=2" width="32" height="32">
        <img src="/favicon-b.svg?v=2" width="16" height="16">
      </div>
      <p class="size-label">256px · 64px · 32px · 16px</p>
    </div>

    <div class="card">
      <img src="/favicon-c.svg?v=4" width="256" height="256" style="display:block;">
      <h2>Version C</h2>
      <p>Dégradé bleu · Luciole étoile</p>
      <div class="sizes">
        <img src="/favicon-c.svg?v=4" width="64" height="64">
        <img src="/favicon-c.svg?v=4" width="32" height="32">
        <img src="/favicon-c.svg?v=4" width="16" height="16">
      </div>
      <p class="size-label">256px · 64px · 32px · 16px</p>
    </div>

  </div>
</body>
</html>
