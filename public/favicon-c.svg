<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5BA3D0"/>
      <stop offset="100%" stop-color="#1A4A7A"/>
    </linearGradient>
  </defs>

  <!-- Fond dégradé -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>

  <!-- Reflet subtil haut -->
  <rect x="1.5" y="1.5" width="29" height="13" rx="4.5" fill="white" opacity="0.09"/>

  <!-- L : trait vertical centré, bien épais -->
  <rect x="5" y="4.5" width="7" height="23" rx="3" fill="white"/>

  <!-- L : trait horizontal, recouvre la jointure -->
  <rect x="5" y="20.5" width="22" height="7" rx="3" fill="white"/>

  <!-- Grande étoile 4 branches luciole -->
  <g transform="translate(27, 6)">
    <path d="M0,-4.5 C0.6,-1.2 1.2,-0.6 4.5,0 C1.2,0.6 0.6,1.2 0,4.5 C-0.6,1.2 -1.2,0.6 -4.5,0 C-1.2,-0.6 -0.6,-1.2 0,-4.5Z" fill="#FFD700"/>
  </g>

  <!-- Étoile secondaire -->
  <g transform="translate(29, 13)">
    <path d="M0,-2.5 C0.32,-0.68 0.68,-0.32 2.5,0 C0.68,0.32 0.32,0.68 0,2.5 C-0.32,0.68 -0.68,0.32 -2.5,0 C-0.68,-0.32 -0.32,-0.68 0,-2.5Z" fill="#FFD700" opacity="0.7"/>
  </g>

  <!-- Micro étincelle -->
  <circle cx="25" cy="9" r="1.5" fill="#FFD700" opacity="0.5"/>
</svg>
