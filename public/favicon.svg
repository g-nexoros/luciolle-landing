<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5BA3D0"/>
      <stop offset="100%" stop-color="#1A4A7A"/>
    </linearGradient>
  </defs>

  <!-- Fond dégradé -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>

  <!-- Reflet subtil haut -->
  <rect x="1.5" y="1.5" width="29" height="13" rx="4.5" fill="white" opacity="0.09"/>

  <!-- L : trait vertical -->
  <rect x="4" y="4" width="8" height="22" rx="3.5" fill="white"/>

  <!-- L : trait horizontal -->
  <rect x="4" y="18" width="20" height="8" rx="3.5" fill="white"/>

  <!-- Grande étoile luciole — centrée à droite, bien visible -->
  <g transform="translate(23, 11)">
    <path d="M0,-5 C0.65,-1.3 1.3,-0.65 5,0 C1.3,0.65 0.65,1.3 0,5 C-0.65,1.3 -1.3,0.65 -5,0 C-1.3,-0.65 -0.65,-1.3 0,-5Z" fill="#FFD700"/>
  </g>

  <!-- Étoile secondaire -->
  <g transform="translate(26.5, 18)">
    <path d="M0,-3 C0.4,-0.8 0.8,-0.4 3,0 C0.8,0.4 0.4,0.8 0,3 C-0.4,0.8 -0.8,0.4 -3,0 C-0.8,-0.4 -0.4,-0.8 0,-3Z" fill="#FFD700" opacity="0.75"/>
  </g>

  <!-- Micro étincelle -->
  <circle cx="20.5" cy="7" r="1.8" fill="#FFD700" opacity="0.55"/>
</svg>
